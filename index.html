<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شركة النخبة — متجر إلكتروني</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #121826;
    --card-2: #172033;
    --text: #f3f6fb;
    --muted: #9aa7bd;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --warn: #f59e0b;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: #0e1420;
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    display: grid;
    place-items: center;
    font-weight: 800;
    color: #06101d;
    font-size: 1rem;
  }
  .brand h1 { margin: 0; font-size: 1.1rem; }
  .brand small { color: var(--muted); display: block; font-size: 0.75rem; }
  .controls {
    max-width: 1200px;
    margin: 10px auto 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  @media (max-width: 640px) {
    .controls { grid-template-columns: 1fr; }
  }
  .search-box, select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.9rem;
    outline: none;
  }
  .tabs {
    max-width: 1200px;
    margin: 10px auto 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .tab {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.84rem;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    color: #06101d;
    border-color: transparent;
    font-weight: 700;
  }
  main {
    max-width: 1200px;
    margin: 14px auto 40px;
    padding: 0 14px;
  }
  .summary-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 0.86rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .meta-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.76rem;
    color: var(--muted);
  }
  .tag {
    background: rgba(56, 189, 248, 0.14);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .title { margin: 6px 0 4px; font-size: 0.98rem; font-weight: 700; }
  .desc { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .price-box {
    background: var(--card-2);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .price-usd { font-size: 1.15rem; font-weight: 800; color: var(--accent-2); }
  .price-old-note { font-size: 0.75rem; color: var(--warn); text-decoration: line-through; margin-inline-start: 4px; }
  .price-syp { font-size: 0.75rem; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.btn, a.btn {
    border: none;
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-details { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
  .btn-wa { background: #22c55e; color: #052e16; }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 60;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    padding: 18px;
    max-height: 86vh;
    overflow-y: auto;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .modal-head h2 { margin: 0; font-size: 1.05rem; }
  .close-btn { background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .spec-list { margin: 10px 0; padding-inline-start: 18px; font-size: 0.9rem; }
  .spec-list li { margin-bottom: 5px; }
  .modal-footer { display: flex; gap: 8px; margin-top: 14px; }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #f8fafc;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    z-index: 80;
    display: none;
  }
  .toast.show { display: block; }
</style>
</head>

        <small>لابتوبات • تدفئة وتوابعها • غسالات (42 منتج)</small>
      </div>
    </div>
    <div style="font-size:0.78rem;color:var(--muted);">~15,200 ل.س قديمة/$</div>
  </div>

  <div class="controls">
    <input id="searchInput" class="search-box" type="search" placeholder="ابحث باسم المنتج، الماركة، السعة أو المواصفات..." />

      <option value="price-desc">السعر: من الأعلى إلى الأقل</option>

  </div>

  <div class="tabs" id="categoryTabs">

    <button class="tab" data-cat="heating">التدفئة وتوابعها (16)</button>
    <button class="tab" data-cat="washers">الغسالات (13)</button>
  </div>
</header>

<main>
  <div class="summary-bar">

    <span>للطلب الفوري: اضغط "اطلب الآن"</span>
  </div>
  <div class="grid" id="productsGrid"></div>
</main>

<div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">تفاصيل المنتج</h2>
      <button class="close-btn" id="closeModal">✕</button>
    </div>
    <div id="modalMeta" style="font-size:0.82rem;color:var(--muted);margin-top:6px;"></div>
    <ul class="spec-list" id="modalSpecs"></ul>
    <div id="modalPriceBox" class="price-box"></div>
    <div class="modal-footer">
      <button class="btn btn-details" id="copyInfoBtn">نسخ المواصفات</button>
      <a class="btn btn-wa" id="modalWaBtn" target="_blank" rel="noopener">اطلب عبر واتساب</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

var activeCat = "all";
var grid = document.getElementById("productsGrid");
var searchInput = document.getElementById("searchInput");
var sortSelect = document.getElementById("sortSelect");
var resultCount = document.getElementById("resultCount");
var modal = document.getElementById("detailModal");
var toast = document.getElementById("toast");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function() { toast.classList.remove("show"); }, 2000);
}

function approxOldSyp(usd) {
  var val = Math.round((usd * SYP_APPROX_RATE) / 10000) * 10000;
  return "~" + val.toLocaleString("en-US") + " ل.س قديمة";
}

function waUrl(p) {
  var msg = "مرحباً شركة النخبة، أرغب بطلب المنتج رقم #" + p.id + ": " + p.name + " بسعر " + p.price + "$";
  return "https://wa.me/" + WHATSAPP_PHONE + "?text=" + encodeURIComponent(msg);
}

function getFilteredProducts() {
  var q = searchInput.value.trim().toLowerCase();
  var list = PRODUCTS.filter(function(p) {
    var catOk = activeCat === "all" || p.cat === activeCat;
    var hay = (p.id + " " + p.name + " " + p.dept + " " + p.sub + " " + p.short + " " + p.specs.join(" ")).toLowerCase();
    var qOk = !q || hay.indexOf(q) !== -1;
    return catOk && qOk;
  });

  if (sortSelect.value === "price-asc") list.sort(function(a, b) { return a.price - b.price; });
  else if (sortSelect.value === "price-desc") list.sort(function(a, b) { return b.price - a.price; });
  else list.sort(function(a, b) { return a.id - b.id; });
  return list;
}

function render() {
  var list = getFilteredProducts();
  resultCount.textContent = "عرض " + list.length + " من أصل " + PRODUCTS.length + " منتج";
  if (!list.length) {
    grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:24px;">لا توجد منتجات مطابقة لبحثك.</p>';
    return;
  }
  grid.innerHTML = list.map(function(p) {
    return (
      '<article class="card">' +
        '<div>' +
          '<div class="meta-top"><span class="tag">' + p.dept + '</span><span>#' + p.id + '</span></div>' +
          '<h3 class="title">' + p.name + '</h3>' +
          '<p class="desc">' + p.short + '</p>' +
        '</div>' +
        '<div>' +
          '<div class="price-box" style="margin-bottom:8px;">' +
            '<div><span class="price-usd">' + p.price + '$</span>' + (p.oldPrice ? '<span class="price-old-note">' + p.oldPrice + '$</span>' : '') + '</div>' +
            '<span class="price-syp">' + approxOldSyp(p.price) + '</span>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn btn-details" onclick="openDetails(' + p.id + ')">التفاصيل</button>' +
            '<a class="btn btn-wa" href="' + waUrl(p) + '" target="_blank" rel="noopener">اطلب الآن</a>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }).join("");
}

function openDetails(id) {
  var p = PRODUCTS.find(function(x) { return x.id === id; });
  if (!p) return;
  document.getElementById("modalTitle").textContent = "#" + p.id + " — " + p.name;
  document.getElementById("modalMeta").textContent = p.dept + " ← " + p.sub;
  document.getElementById("modalSpecs").innerHTML = p.specs.map(function(s) { return "<li>" + s + "</li>"; }).join("");
  document.getElementById("modalPriceBox").innerHTML =
    '<div><span class="price-usd">' + p.price + '$</span>' + (p.oldPrice ? '<span class="price-old-note">' + p.oldPrice + '$</span>' : '') + '</div>' +
    '<span class="price-syp">' + approxOldSyp(p.price) + '</span>';
  document.getElementById("modalWaBtn").href = waUrl(p);
  document.getElementById("copyInfoBtn").onclick = function() {
    var txt = p.name + " (#" + p.id + ")\n" + p.specs.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function() { showToast("تم نسخ مواصفات المنتج"); });
    }
  };
  modal.classList.add("open");
}

document.getElementById("closeModal").addEventListener("click", function() { modal.classList.remove("open"); });
modal.addEventListener("click", function(e) { if (e.target === modal) modal.classList.remove("open"); });

document.getElementById("categoryTabs").addEventListener("click", function(e) {
  var btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
  btn.classList.add("active");
  activeCat = btn.getAttribute("data-cat");
  render();
});

searchInput.addEventListener("input", render);
sortSelect.addEventListener("change", render);

render();
</script>
