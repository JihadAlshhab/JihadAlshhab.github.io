<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شركة النخبة — متجر إلكتروني</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #121826;
    --card-2: #172033;
    --text: #f3f6fb;
    --muted: #9aa7bd;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --warn: #f59e0b;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }

  /* شاشة الانتظار 3 ثوانٍ عند الدخول */
  #splash-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle at top, #162238 0%, #0b0f17 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }
  #splash-loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .loader-brand {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.3px;
  }
  .loader-brand span {
    color: var(--accent);
  }
  .spinner {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 4px solid rgba(56, 189, 248, 0.18);
    border-top-color: var(--accent);
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loader-msg {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
  }
  .loader-bar-wrap {
    width: min(280px, 80vw);
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
  }
  .loader-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width 2.9s linear;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(11, 15, 23, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-badge {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    display: grid;
    place-items: center;
    font-weight: 800;
    color: #06101d;
    font-size: 1.1rem;
  }
  .brand h1 {
    margin: 0;
    font-size: 1.2rem;
  }
  .brand small {
    color: var(--muted);
    display: block;
    font-size: 0.78rem;
  }
  .controls {
    max-width: 1200px;
    margin: 14px auto 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }
  @media (max-width: 640px) {
    .controls { grid-template-columns: 1fr; }
  }
  .search-box, select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.95rem;
    outline: none;
  }
  .search-box:focus, select:focus {
    border-color: var(--accent);
  }
  .tabs {
    max-width: 1200px;
    margin: 12px auto 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tab {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.88rem;
    white-space: nowrap;
    transition: 0.2s;
  }
  .tab.active, .tab:hover {
    background: var(--accent);
    color: #06101d;
    border-color: transparent;
    font-weight: 700;
  }
  main {
    max-width: 1200px;
    margin: 18px auto 48px;
    padding: 0 16px;
  }
  .summary-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(56, 189, 248, 0.35);
  }
  .meta-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .tag {
    background: rgba(56, 189, 248, 0.14);
    color: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
  }
  .title {
    margin: 6px 0 6px;
    font-size: 1.02rem;
    font-weight: 700;
  }
  .desc {
    margin: 0;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .price-box {
    background: var(--card-2);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .price-usd {
    font-size: 1.22rem;
    font-weight: 800;
    color: var(--accent-2);
  }
  .price-old-note {
    font-size: 0.76rem;
    color: var(--warn);
    text-decoration: line-through;
    margin-inline-start: 6px;
  }
  .price-syp {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  button.btn {
    border: none;
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn-details {
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-wa {
    background: #22c55e;
    color: #052e16;
  }

  /* نافذة التفاصيل */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    max-width: 540px;
    width: 100%;
    padding: 20px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .modal-head h2 { margin: 0; font-size: 1.12rem; }
  .close-btn {
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 1rem;
  }
  .spec-list {
    margin: 12px 0;
    padding-inline-start: 18px;
    color: var(--text);
    font-size: 0.92rem;
  }
  .spec-list li { margin-bottom: 6px; }
  .modal-footer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid rgba(255,255,255,0.14);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.88rem;
    z-index: 80;
    display: none;
  }
  .toast.show { display: block; }
</style>
</head>

// تشغيل شاشة الانتظار لمدة 3 ثوانٍ بالضبط عند الدخول
window.addEventListener("DOMContentLoaded", () => {
  const loader = document.getElementById("splash-loader");
  const bar = document.getElementById("loaderBar");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (bar) bar.style.width = "100%";
    });
  });
  setTimeout(() => {
    if (loader) loader.classList.add("hide");
  }, 3000);
});

let activeCat = "all";
const grid = document.getElementById("productsGrid");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
const resultCount = document.getElementById("resultCount");
const modal = document.getElementById("detailModal");
const toast = document.getElementById("toast");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

function approxOldSyp(usd) {
  const val = Math.round((usd * SYP_APPROX_RATE) / 10000) * 10000;
  return "~" + val.toLocaleString("en-US") + " ل.س قديمة";
}

function waUrl(product) {
  const msg = `مرحباً شركة النخبة، أرغب بالاستفسار / طلب المنتج رقم #${product.id}: ${product.name} بسعر ${product.price}$`;
  return `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
}

function getFilteredProducts() {
  const q = searchInput.value.trim().toLowerCase();
  let list = PRODUCTS.filter(p => {
    const catOk = activeCat === "all" || p.cat === activeCat;
    const hay = `${p.id} ${p.name} ${p.dept} ${p.sub} ${p.short} ${p.specs.join(" ")}`.toLowerCase();
    const qOk = !q || hay.includes(q);
    return catOk && qOk;
  });

  if (sortSelect.value === "price-asc") {
    list.sort((a, b) => a.price - b.price);
  } else if (sortSelect.value === "price-desc") {
    list.sort((a, b) => b.price - a.price);
  } else {
    list.sort((a, b) => a.id - b.id);
  }
  return list;
}

function render() {
  const list = getFilteredProducts();
  resultCount.textContent = `عرض ${list.length} من أصل ${PRODUCTS.length} منتج`;
  if (!list.length) {
    grid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:30px;">لا توجد منتجات مطابقة لبحثك.</p>`;
    return;
  }
  grid.innerHTML = list.map(p => `
    <article class="card">
      <div>
        <div class="meta-top">
          <span class="tag">${p.dept}</span>
          <span>#${p.id}</span>
        </div>
        <h3 class="title">${p.name}</h3>
        <p class="desc">${p.short}</p>
      </div>
      <div>
        <div class="price-box" style="margin-bottom:10px;">
          <div>
            <span class="price-usd">${p.price}$</span>
            ${p.oldPrice ? `<span class="price-old-note">${p.oldPrice}$</span>` : ""}
          </div>
          <span class="price-syp">${approxOldSyp(p.price)}</span>
        </div>
        <div class="actions">
          <button class="btn btn-details" onclick="openDetails(${p.id})">التفاصيل</button>
          <a class="btn btn-wa" href="${waUrl(p)}" target="_blank" rel="noopener">اطلب الآن</a>
        </div>
      </div>
    </article>
  `).join("");
}

function openDetails(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  document.getElementById("modalTitle").textContent = `#${p.id} — ${p.name}`;
  document.getElementById("modalMeta").textContent = `${p.dept} ← ${p.sub}`;
  document.getElementById("modalSpecs").innerHTML = p.specs.map(s => `<li>${s}</li>`).join("");
  document.getElementById("modalPriceBox").innerHTML = `
    <div>
      <span class="price-usd">${p.price}$</span>
      ${p.oldPrice ? `<span class="price-old-note">${p.oldPrice}$</span>` : ""}
    </div>
    <span class="price-syp">${approxOldSyp(p.price)}</span>
  `;
  const waBtn = document.getElementById("modalWaBtn");
  waBtn.href = waUrl(p);

  document.getElementById("copyInfoBtn").onclick = () => {
    const txt = `${p.name} (#${p.id})
${p.specs.join("
")}`;
    navigator.clipboard?.writeText(txt).then(() => showToast("تم نسخ مواصفات المنتج"));
  };
  modal.classList.add("open");
}

document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("open"));
modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });

document.getElementById("categoryTabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  activeCat = btn.dataset.cat;
  render();
});

searchInput.addEventListener("input", render);
sortSelect.addEventListener("change", render);

render();
</script>
